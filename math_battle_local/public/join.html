<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Battle — Нэгдэх</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(13, 148, 136, 0.2), transparent 45%),
          radial-gradient(circle at 90% 70%, rgba(245, 158, 11, 0.22), transparent 40%),
          linear-gradient(160deg, #e8f6ff, #f7fffb);
        color: #0f2b3c;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/95 rounded-3xl shadow-sm border border-teal-100 p-6 w-full max-w-md">
      <p class="text-teal-700 font-extrabold text-xs tracking-widest">MATH BATTLE</p>
      <h1 class="text-2xl font-extrabold mt-1 mb-1">Ангидаа нэгдэх</h1>
      <p class="text-slate-600 mb-6">Код болон нэрээ оруулаад багшийг хүлээнэ үү.</p>

      <form id="joinForm" class="space-y-4">
        <div>
          <label class="block font-bold mb-1" for="code">Ангины код</label>
          <input
            id="code"
            class="w-full border-2 border-teal-100 focus:border-teal-400 outline-none rounded-2xl px-4 py-3 uppercase tracking-wider font-extrabold"
            placeholder="Жишээ: ABC12"
            required
            autocomplete="off"
          />
        </div>
        <div>
          <label class="block font-bold mb-1" for="name">Нэр</label>
          <input
            id="name"
            class="w-full border-2 border-teal-100 focus:border-teal-400 outline-none rounded-2xl px-4 py-3 font-bold"
            placeholder="Нэрээ бичнэ үү"
            required
            autocomplete="name"
          />
        </div>
        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white rounded-2xl px-4 py-3 font-extrabold">
          Нэгдэх
        </button>
        <p id="joinError" class="text-rose-600 text-sm font-bold min-h-[20px]"></p>
      </form>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const initialCode = params.get("code") || params.get("c") || "";
      document.getElementById("code").value = initialCode;
      const joinError = document.getElementById("joinError");

      document.getElementById("joinForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        joinError.textContent = "";
        const code = document.getElementById("code").value.trim().toUpperCase();
        const name = document.getElementById("name").value.trim();

        if (!code || !name) {
          joinError.textContent = "Ангины код болон нэрээ оруулна уу.";
          return;
        }

        const res = await fetch("/api/student/join", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, name }),
        });

        const data = await res.json();
        if (!res.ok) {
          if (data.alreadyFinished) {
            joinError.innerHTML = `${data.message}<br/><span class="text-slate-700">Оноо: ${data.scores?.total ?? 0} (Ү1:${data.scores?.stage1 ?? 0} Ү2:${data.scores?.stage2 ?? 0} Ү3:${data.scores?.stage3 ?? 0})</span>`;
            return;
          }
          joinError.textContent = data.message || "Алдаа гарлаа";
          return;
        }

        window.location.href = `/student?code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
      });
    </script>
  </body>
</html>
